# ============================================
# Sketchmaker nginx site
# ============================================
# Rendered to /etc/nginx/sites-available/sketchmaker by server/common.sh, on every
# install and update. Edit this file, not the installed copy.
#
# Placeholders filled in at render time:
#   __SERVER_NAMES__  space-separated host names, primary first
#   __CERT_NAME__     Let's Encrypt certificate name (/etc/letsencrypt/live/<name>)
#
# The file is included inside http {}, so it holds only http-level directives and server
# blocks. Certbot never edits it: certificates come from "certbot certonly --webroot" and
# the certbot timer renews them, so re-rendering never loses TLS settings.
#
# nginx only terminates TLS and limits abuse. The app serves everything, including the
# frontend and /static, because /static requires a login, and it sets the security
# headers itself (CSP, HSTS, nosniff and the rest), so they are not repeated here.

# --------------------------------------------
# Real client IP behind Cloudflare
# --------------------------------------------
# CF-Connecting-IP is trusted only when the TCP peer is a Cloudflare edge, so $remote_addr
# becomes the visitor for rate limits, logs and the X-Forwarded-For sent to the app. A
# direct client cannot spoof it, and it is a no-op when the site is not proxied.
# Source: https://www.cloudflare.com/ips/ (update.sh warns when the list changes).
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# --------------------------------------------
# Rate limiting (keyed on the real client IP)
# --------------------------------------------
# These sit in front of the app's own limits (app/middleware/rate_limiter.py) and are
# generous enough for an office of editors sharing one address.
limit_req_zone $binary_remote_addr zone=sketchmaker_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=sketchmaker_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=sketchmaker_general:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=sketchmaker_media:10m rate=100r/s;
limit_conn_zone $binary_remote_addr zone=sketchmaker_conn:10m;

# --------------------------------------------
# Drop requests for unknown Host names
# --------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    server_tokens off;

    # Placeholder certificate from the ssl-cert package; the handshake for an
    # unknown name is answered and the connection then closed.
    ssl_certificate /etc/ssl/certs/ssl-cert-snakeoil.pem;
    ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;
    # The protocol is negotiated with the default server's settings, so they
    # must match the site below.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    return 444;
}

# --------------------------------------------
# HTTP: ACME challenges, everything else to HTTPS
# --------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAMES__;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --------------------------------------------
# HTTPS: the application
# --------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __SERVER_NAMES__;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/__CERT_NAME__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__CERT_NAME__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SketchmakerTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ============================================
    # COMPRESSION
    # ============================================
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml image/svg+xml;

    # ============================================
    # CLIENT SETTINGS & LIMITS
    # ============================================
    # The largest upload caps in the app are 100 MB; the extra 10 MB is multipart framing,
    # so a file at the cap gets the app's JSON error, never nginx's HTML 413. Larger
    # bodies are allowed per location below.
    client_max_body_size 110M;
    client_header_timeout 30s;
    client_body_timeout 120s;
    send_timeout 120s;
    keepalive_timeout 65s;

    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 16k;

    # High enough for a gallery full of media over HTTP/1.1 from one office address.
    limit_conn sketchmaker_conn 200;
    limit_conn_status 429;
    limit_req_status 429;

    # ============================================
    # PROXY DEFAULTS (inherited by every proxy location)
    # ============================================
    # proxy_set_header is dropped in any location that sets its own, so these are only
    # ever set here.
    #
    # X-Forwarded-For is OVERWRITTEN with $remote_addr (the real client, see real_ip
    # above), never appended to: an appended header would let a client choose its own
    # address for rate limits and lockouts.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    proxy_connect_timeout 10s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # ============================================
    # SECURITY BLOCKS (regex locations: checked in order, before prefixes)
    # ============================================
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location ~ /\. {
        return 404;
    }

    location ~* \.(env|git|htaccess|htpasswd|ini|log|sh|sql|conf|bak|swp|map|py|pyc|dump|sqlite|db)$ {
        return 404;
    }

    location ~* (eval\(|base64_|script>|<script) {
        return 403;
    }

    # ============================================
    # API ROUTES
    # ============================================
    location ~ ^/api/auth/(login|setup)(/|$) {
        limit_req zone=sketchmaker_auth burst=5 nodelay;
        # Credential responses: no compression (BREACH).
        gzip off;

        proxy_pass http://unix:/run/sketchmaker/sketchmaker.sock;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Story Room replies stream as server-sent events, which buffering would hold back.
    location ^~ /api/story-room/ {
        limit_req zone=sketchmaker_api burst=50 nodelay;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_pass http://unix:/run/sketchmaker/sketchmaker.sock;
    }

    # Subtitle source videos are accepted up to 500 MB
    # (app/routers/subtitle.py MAX_SUBTITLE_SOURCE_BYTES). Streamed, not buffered to disk
    # here first, so the app can refuse a stranger's upload from its headers alone
    # (middleware/security.py).
    location = /api/subtitle/upload {
        limit_req zone=sketchmaker_api burst=50 nodelay;
        client_max_body_size 520M;
        proxy_request_buffering off;
        proxy_pass http://unix:/run/sketchmaker/sketchmaker.sock;
    }

    location /api {
        limit_req zone=sketchmaker_api burst=50 nodelay;
        proxy_request_buffering off;
        proxy_pass http://unix:/run/sketchmaker/sketchmaker.sock;
    }

    location = /health {
        proxy_pass http://unix:/run/sketchmaker/sketchmaker.sock:/api/health;
    }

    # ============================================
    # MEDIA (requires a login, checked by the app)
    # ============================================
    # Not spilled to a temporary file on the way through: videos can be large. ^~ skips
    # the blocks above, so a media file is never refused for its name; the app checks the
    # login and the path.
    location ^~ /static/ {
        limit_req zone=sketchmaker_media burst=500 nodelay;
        proxy_max_temp_file_size 0;
        proxy_pass http://unix:/run/sketchmaker/sketchmaker.sock;
    }

    # ============================================
    # THE FRONTEND
    # ============================================
    location / {
        limit_req zone=sketchmaker_general burst=100 nodelay;
        proxy_pass http://unix:/run/sketchmaker/sketchmaker.sock;
    }
}
